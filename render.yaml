services:
  - type: web
    name: awexen-lms-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c 'python manage.py migrate --noinput && gunicorn awexen_api.wsgi:application --bind 0.0.0.0:${PORT:-10000} --workers 2 --access-logfile -'
    healthCheckPath: /api/v1/health/ready/
    autoDeployTrigger: checksPass
    domains:
      - api.awexen.com
    envVars:
      - key: AWEXEN_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: ALLOWED_HOSTS
        value: api.awexen.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://awexen.com,https://www.awexen.com
      - key: SECURE_SSL_REDIRECT
        value: true
      - key: TIME_ZONE
        value: Africa/Cairo
      - key: LMS_DEFAULT_ORGANIZATION_SLUG
        value: awexen
      - key: LMS_DEFAULT_ORGANIZATION_NAME
        value: Awexen
      - key: LMS_BOOTSTRAP_ADMIN_EMAILS
        value: elagwza34@gmail.com
      - key: LMS_PAYMENT_PHONE
        value: "01092400443"
      - key: LMS_PAYMENT_PROOFS_BUCKET
        value: payment-proofs
      - key: LMS_PAYMENT_PROOF_MAX_BYTES
        value: "5242880"
      - key: LOG_LEVEL
        value: INFO
