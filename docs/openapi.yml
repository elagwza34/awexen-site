components:
  schemas:
    AdminEnrollment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization_id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
          readOnly: true
        student_email:
          type: string
          format: email
          readOnly: true
        student_name:
          type: string
          readOnly: true
        course_version_id:
          type: string
          format: uuid
          readOnly: true
        course_title:
          type: string
          readOnly: true
        version_number:
          type: integer
          readOnly: true
        cohort_id:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/EnrollmentStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
        progress_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          default: '0.00'
        enrolled_at:
          type: string
          format: date-time
          readOnly: true
        activated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - activated_at
      - cohort_id
      - completed_at
      - course_title
      - course_version_id
      - enrolled_at
      - id
      - organization_id
      - progress_percent
      - status
      - status_reason
      - student_email
      - student_name
      - user_id
      - version_number
    Cohort:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 180
        status:
          $ref: '#/components/schemas/CohortStatusEnum'
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        timezone:
          type: string
          maxLength: 64
        organization:
          type: string
          format: uuid
        course_version:
          type: string
          format: uuid
      required:
      - course_version
      - created_at
      - id
      - name
      - organization
      - updated_at
    CohortStatusEnum:
      enum:
      - draft
      - open
      - active
      - completed
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `open` - Open
        * `active` - Active
        * `completed` - Completed
        * `cancelled` - Cancelled
    CompletionRuleEnum:
      enum:
      - manual
      - view
      - video_threshold
      type: string
      description: |-
        * `manual` - Manual completion
        * `view` - Complete on view
        * `video_threshold` - Video threshold
    ContentStatusEnum:
      enum:
      - draft
      - published
      type: string
      description: |-
        * `draft` - Draft
        * `published` - Published
    ContentTypeEnum:
      enum:
      - text
      - video
      - audio
      - document
      - presentation
      - external_url
      - live
