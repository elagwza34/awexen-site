    <title>Awexen | تصميم وبرمجة مواقع وتطبيقات للشركات</title>
    <style>
      #awexen-boot{position:fixed;inset:0;z-index:2147483001;display:flex;align-items:center;justify-content:center;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:opacity .3s ease}
      #awexen-boot .bx{text-align:center;padding:24px;direction:rtl;max-width:360px}
      #awexen-boot .mark{font-weight:800;letter-spacing:.22em;font-size:15px}
      #awexen-boot .dot{color:#ff7f38}
      #awexen-boot .msg{margin-top:10px;font-size:12px;color:rgba(255,255,255,.55)}
      #awexen-boot .ring{margin:18px auto 0;width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#ff6200;animation:awexen-spin .9s linear infinite}
      #awexen-boot .acts{display:none;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
      #awexen-boot .acts button{cursor:pointer;border-radius:10px;padding:10px 18px;font:700 13px system-ui,sans-serif;border:0}
      #awexen-boot .acts .primary{background:#ff6200;color:#fff}
      #awexen-boot .acts .ghost{background:rgba(255,255,255,.08);color:#fff}
      #awexen-boot .hint{display:none;margin-top:14px;font-size:12px;line-height:1.9;color:rgba(255,255,255,.65)}
      #awexen-boot.is-error .ring,#awexen-boot.is-outdated .ring{display:none}
      #awexen-boot.is-error .acts{display:flex}
      #awexen-boot.is-error .hint,#awexen-boot.is-outdated .hint{display:block}
      #awexen-boot.is-outdated .msg{color:#ffc8a5}
      @keyframes awexen-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce){#awexen-boot .ring{animation:none}}
      html{background:#0b1020}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="awexen-boot" role="status" aria-live="polite">
      <div class="bx">
        <div class="mark">AWEXEN<span class="dot">.</span></div>
        <div class="msg" id="awexen-boot-msg">جارٍ تحميل الموقع…</div>
        <div class="ring" aria-hidden="true"></div>
        <div class="acts">
          <button type="button" class="primary" id="awexen-boot-retry">إعادة المحاولة</button>
          <button type="button" class="ghost" id="awexen-boot-reset">مسح الكاش وإعادة التحميل</button>
        </div>
        <div class="hint" id="awexen-boot-hint">إن استمرت المشكلة: تأكد من اتصال الإنترنت، أو جرّب متصفحًا آخر، أو تواصل معنا.</div>
      </div>
    </div>
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b1020;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:24px">
        <p>هذا الموقع يحتاج JavaScript للتشغيل. من فضلك فعّل JavaScript في متصفحك ثم أعد تحميل الصفحة.</p>
      </div>
    </noscript>
    <script>
      (function () {
        var boot = document.getElementById("awexen-boot");
        var msg = document.getElementById("awexen-boot-msg");
        var hint = document.getElementById("awexen-boot-hint");
        var retry = document.getElementById("awexen-boot-retry");
        var reset = document.getElementById("awexen-boot-reset");
        var root = document.getElementById("root");
        var settled = false;

        function supported() {
          try {
            if (!window.CSS || !window.CSS.supports) return false;
            return window.CSS.supports("color", "oklch(50% 0.1 40)") &&
              window.CSS.supports("color", "color-mix(in oklab, red 50%, transparent)") &&
              window.CSS.supports("selector(:has(*))");
          } catch (e) {
            return false;
          }
        }

        function showError(title, detail) {
          if (!boot || !msg) return;
          boot.className = "is-error";
          msg.textContent = title;
          if (hint && detail) hint.textContent = detail;
        }

        function dismiss() {
          if (!boot || settled) return;
          settled = true;
          boot.style.display = "none";
          if (boot.parentNode) boot.parentNode.removeChild(boot);
        }

        function freshUrl() {
          var query = location.search ? location.search + "&v=" : "?v=";
          return location.pathname + query + Date.now() + location.hash;
        }

        function go(clear) {
          if (clear && window.Promise && window.caches && window.caches.keys) {
            window.caches.keys()
              .then(function (names) {
                return window.Promise.all(names.map(function (name) {
                  return window.caches["delete"](name);
                }));
              })
              ["catch"](function () {})
              .then(function () { location.replace(freshUrl()); });
            return;
          }
          location.replace(freshUrl());
        }

        if (retry) retry.onclick = function () { go(false); };
        if (reset) reset.onclick = function () { go(true); };

        if (!supported()) {
          if (boot) boot.className = "is-outdated";
          if (msg) msg.textContent = "متصفحك قديم ولا يدعم خصائص العرض الحديثة.";
          if (hint) hint.textContent = "حدّث Safari أو Chrome لأحدث إصدار أو افتح الموقع من متصفح آخر. نحتاج iOS 16.4+ أو Chrome 111+.";
          window.__awexenUnsupported = true;
          return;
        }

        function ready() {
          return root && root.childNodes.length > 0 && !document.getElementById("awexen-static-document");
        }

        var watch = setInterval(function () {
          if (ready()) {
            clearInterval(watch);
            dismiss();
          }
        }, 250);

        setTimeout(function () {
          if (ready()) return;
          showError("تعذر تحميل الموقع.", "قد يكون هناك ملف قديم في الكاش أو انقطاع في الشبكة.");
        }, 15000);

        window.addEventListener("error", function (event) {
          var target = event.target;
          if (!target || !target.tagName) return;
          if (target.tagName !== "SCRIPT" && target.tagName !== "LINK") return;
          var url = target.src || target.href || "";
          if (url.indexOf("/assets/") === -1) return;
          setTimeout(function () {
            if (ready()) return;
            showError("تعذر تحميل ملفات الموقع.", "جرّب إعادة المحاولة، أو امسح الكاش ثم أعد التحميل.");
          }, 1200);
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
