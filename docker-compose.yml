services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: awexen
      POSTGRES_USER: awexen
      POSTGRES_PASSWORD: awexen
    ports:
      - "5432:5432"
    volumes:
      - awexen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awexen -d awexen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      AWEXEN_ENV: development
      DATABASE_URL: postgresql://awexen:awexen@postgres:5432/awexen
      REDIS_URL: redis://redis:6379/0
    command: sh -c "python manage.py migrate && gunicorn awexen_api.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      AWEXEN_ENV: development
      DATABASE_URL: postgresql://awexen:awexen@postgres:5432/awexen
      REDIS_URL: redis://redis:6379/0
    command: celery -A awexen_api worker --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  awexen_postgres_data:
