# نشر تلقائي: كل push على main يبني الواجهة ويرفعها لـ Hostinger
# وطبق الـ migrations المعلّقة على Supabase.
#
# الإعداد مطلوب مرة واحدة فقط:
#   Repository → Settings → Environments → production
#     Secrets:  HOSTINGER_SSH_PRIVATE_KEY, HOSTINGER_SSH_HOST,
#               HOSTINGER_SSH_PORT, HOSTINGER_SSH_USER,
#               SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#     Variables: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY,
#               SUPABASE_PROJECT_REF
#
# ملاحظة: VITE_* تُقرأ كـ variables لا secrets لأنهاقيم عامة
# بتوصل للمتصفح أصلًا (مفتاح publishable فقط، لا service role).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  frontend:
    name: Build and upload to Hostinger
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build with production env
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Abort if a server key leaked into the browser bundle
        run: |
          # Match the VALUE shape, never the bare word. The bundle legitimately
          # contains "service_role" and "sb_secret_" inside Arabic help text
          # and inside supabase-js itself, so grepping for those words aborted
          # every deploy without ever catching a real key.
          LEAK=$(grep -rhoE 'sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}' dist/assets/ | sort -u || true)
          if [ -n "$LEAK" ]; then
            echo "::error::A server-side key leaked into dist/. Aborting deploy."
            echo "$LEAK" | cut -c1-12
            exit 1
          fi
          echo "No secret keys in dist."

      - name: Upload dist to public_html over SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          source: frontend/dist/*
          target: public_html
          strip_components: 1
          rm: true

      - name: Verify the site responds
        run: |
          sleep 8
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://awexen.com/ || true)
          echo "awexen.com HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Site is not responding after deploy (HTTP $STATUS)"
            exit 1
          fi

  database:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the Supabase project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push pending migrations
        run: supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Report the migration state afterwards
        run: supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  edge-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Regression guard: this job was missing entirely, so every fix inside
      # supabase/functions/ stayed local while the frontend shipped from CI.
      # That is what left production running the old payment-proof path check.
      - name: Deploy lms-public
        run: supabase functions deploy lms-public --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy lms-api
        run: supabase functions deploy lms-api --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ask-awexen
        run: supabase functions deploy ask-awexen --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy extract-knowledge-pdf
        run: supabase functions deploy extract-knowledge-pdf --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify the public health endpoint answers
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ vars.VITE_SUPABASE_URL }}/functions/v1/lms-public?path=health" || true)
          echo "lms-public HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::lms-public did not answer 200 after deploying the edge functions"
            exit 1
          fi
