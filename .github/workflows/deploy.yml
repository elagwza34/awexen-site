# نشر تلقائي: كل push على main يبني الواجهة ويرفعها لـ Hostinger،
# وينشر Edge Functions إذا كانت اتغيّرت واعتمادات Supabase متاحة.
#
# الإعداد المطلوب مرة واحدة فقط:
#   Repository → Settings → Environments → production
#     Secrets:  HOSTINGER_SSH_PRIVATE_KEY, HOSTINGER_SSH_HOST,
#               HOSTINGER_SSH_PORT, HOSTINGER_SSH_USER,
#               SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#     Variables: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY,
#               SUPABASE_PROJECT_REF
#
# ملاحظة: VITE_* تُقرأ كـ variables لا secrets لأنها قيم عامة
# بتوصل للمتصفح أصلًا (مفتاح publishable فقط، لا service role).
#
# ترتيب النشر مقصود: الدوال (backend) الأول، وبعدها الواجهة (frontend).
# كذا ماينفعش واجهة جديدة تعتمد على دالة جديدة قبل ما الدالة تكون منشورة.
# والترحيلات (database) بتتطبّق يدويًا من owner المشروع على Supabase.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Edge Functions
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Edge Functions)
    runs-on: ubuntu-latest
    environment: production
    outputs:
      functions_changed: ${{ steps.scope.outputs.functions }}
      deployed: ${{ steps.credentials.outputs.ok }}
    steps:
      # fetch-depth: 0 عشان نقدر نقارن مع الكوميت السابق بدقة.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # بنحدد هل الدوال اتغيّرت في الـpush ده. لو اتغيّرت والاعتمادات
      # ناقصة، النشر بيفشل صراحةً بدل ما الكود الجديد يفضل محلي.
      - name: Detect changed backend files
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE=""
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE=$(git rev-parse HEAD^)
          fi
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" "$SHA")
          else
            CHANGED=$(git show --name-only --pretty=format: "$SHA")
          fi
          FUNCTIONS=$(printf '%s\n' "$CHANGED" | grep -E '^supabase/functions/' || true)
          MIGRATIONS=$(printf '%s\n' "$CHANGED" | grep -E '^supabase/migrations/' || true)
          if [ -n "$FUNCTIONS" ]; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$FUNCTIONS" | sed 's/^/  /'
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$MIGRATIONS" ]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Migration files changed. They are NOT applied by this workflow; apply them manually with an approved Supabase session."
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Supabase deploy credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          FUNCTIONS_CHANGED: ${{ steps.scope.outputs.functions }}
        run: |
          MISSING=""
          if [ -z "$TOKEN" ]; then MISSING="SUPABASE_ACCESS_TOKEN (secret)"; fi
          if [ -z "$PROJECT_REF" ]; then MISSING="$MISSING SUPABASE_PROJECT_REF (variable)"; fi
          if [ -n "$MISSING" ]; then
            if [ "$FUNCTIONS_CHANGED" = "true" ]; then
              echo "::error::supabase/functions changed in this commit, but $MISSING is missing from the production environment. Refusing to leave the new backend code undeployed. Add it in Settings > Environments > production, then re-run this workflow. The frontend job is blocked on purpose so production cannot run old functions with new callers."
              exit 1
            fi
            echo "::warning::Edge functions were NOT deployed. Missing: $MISSING. Add them in Settings > Environments > production to enable backend deploys."
            {
              echo "### Backend deploy skipped"
              echo ""
              echo "Missing: $MISSING"
              echo ""
              echo "No function files changed in this release, so production is consistent."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy lms-public
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy lms-public --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy lms-api
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy lms-api --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ask-awexen
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy ask-awexen --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy extract-knowledge-pdf
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy extract-knowledge-pdf --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy form-notify
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy form-notify --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy project-calculator
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy project-calculator --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # بصحة الدالة المنشورة بنتحقق دايمًا، حتى لو النشر اتخطّى —
      # عشان نتأكد إن الـbackend الشغّال فعليًا سليم.
      - name: Verify the public backend health endpoint
        if: always()
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ vars.VITE_SUPABASE_URL }}/functions/v1/lms-public?path=health" || true)
          echo "lms-public HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::lms-public did not answer 200; backend health is not verified."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Frontend: static build on Hostinger
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (static)
    needs: backend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build with production env
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Abort if a server key leaked into the browser bundle
        run: |
          # Match the VALUE shape, never the bare word. The bundle legitimately
          # contains "service_role" and "sb_secret_" inside Arabic help text
          # and inside supabase-js itself.
          LEAK=$(grep -rhoE 'sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}' dist/assets/ | sort -u || true)
          if [ -n "$LEAK" ]; then
            echo "::error::A server-side key leaked into dist/. Aborting deploy."
            echo "$LEAK" | cut -c1-12
            exit 1
          fi
          echo "No secret keys in dist."

      # الأكشن القديم (appleboy/scp-action) كان بيرفع الملفات بنجاح لكنه
      # بيرجع exit code غير صفري على الاستضافة المشتركة، واللوج مش متاح
      # لصاحب الحساب من الـAPI. استبدلناه بـ OpenSSH الأصلي: نفس البروتوكول،
      # لكن مع exit code حقيقي ورسالة خطأ مقروءة لو الفشل حقيقي.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key

      - name: Upload dist to public_html over SCP
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          USER_NAME: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          # بدون حذف: الأصول القديمة أسماؤها hash مميز، فبقاؤها غير ضار
          # وبيخلي التبويبات المفتوحة شغالة أثناء الانتقال بين الإصدارات.
          ssh -p "$PORT" -i ~/.ssh/hostinger_key \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$USER_NAME@$HOST" "mkdir -p public_html"
          scp -P "$PORT" -i ~/.ssh/hostinger_key \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            -r dist/. "$USER_NAME@$HOST:public_html/"
          echo "Uploaded $(find dist -type f | wc -l) files."

      - name: Verify the deployed version and its assets match this build
        run: |
          EXPECTED=$(node -p "require('./dist/version.json').version")
          ACTUAL=""
          for i in $(seq 1 18); do
            ACTUAL=$(curl -fsS "https://awexen.com/version.json?cb=$(date +%s)" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version||'')}catch{console.log('')}})")
            echo "attempt $i: deployed=$ACTUAL expected=$EXPECTED"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              break
            fi
            sleep 10
          done
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Production version.json ($ACTUAL) does not match the built commit ($EXPECTED)"
            exit 1
          fi

          # نتحقق من كل أصل في HTML الحي: لو الرفع كان جزئيًا هيظهر ملف ناقص
          # أو رجوع صفحة الـfallback بدل JS/CSS.
          HTML=$(curl -fsS "https://awexen.com/?cb=$(date +%s)")
          ASSETS=$(echo "$HTML" | grep -oE '(src|href)="/[^"]+"' | sed 's/.*="//;s/"$//' | sort -u \
            | grep -E '^/(assets|fonts|images)/' || true)
          MISSING=0
          for asset in $ASSETS; do
            HEADERS=$(curl -fsS -o /dev/null -D - "https://awexen.com$asset" || true)
            STATUS=$(echo "$HEADERS" | grep -E '^HTTP/' | tail -1 | grep -oE '[0-9]{3}' | head -1)
            TYPE=$(echo "$HEADERS" | grep -i '^content-type:' | head -1)
            echo "$STATUS $asset ($TYPE)"
            if [ "$STATUS" != "200" ]; then
              MISSING=$((MISSING + 1))
            fi
            case "$asset" in
              *.js) echo "$TYPE" | grep -qi 'javascript' || MISSING=$((MISSING + 1)) ;;
              *.css) echo "$TYPE" | grep -qi 'text/css' || MISSING=$((MISSING + 1)) ;;
              *.woff2) echo "$TYPE" | grep -qi 'font' || MISSING=$((MISSING + 1)) ;;
            esac
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::$MISSING asset(s) referenced by the live HTML are missing or served with the wrong type"
            exit 1
          fi
          echo "All live assets match the new build."

  # ---------------------------------------------------------------------------
  # Release gate: one place that proves what production is running
  # ---------------------------------------------------------------------------
  release:
    name: Release verification
    needs: [backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify frontend, backend, and release consistency
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} functions-changed=${{ needs.backend.outputs.functions_changed }} backend-deployed=${{ needs.backend.outputs.deployed }}"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::Release incomplete: a required job did not succeed."
            exit 1
          fi
          EXPECTED="${GITHUB_SHA:0:7}"
          LIVE=$(curl -fsS "https://awexen.com/version.json?cb=$(date +%s)" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).version||'')})")
          echo "live version: $LIVE (expected $EXPECTED)"
          if [ "$LIVE" != "$EXPECTED" ]; then
            echo "::error::Live version.json does not identify this commit."
            exit 1
          fi
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://awexen.com/functions/v1/lms-public?path=health" || true)
          echo "backend health: HTTP $HEALTH"
          if [ "$HEALTH" != "200" ]; then
            echo "::error::Backend health endpoint is not answering 200."
            exit 1
          fi
          {
            echo "### Release verified"
            echo ""
            echo "- Frontend: \`$LIVE\` (assets checked against live HTML)"
            echo "- Backend: health 200${BACKEND_NOTE}"
            echo "- Migrations: manual / approval-gated (not applied here)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BACKEND_NOTE: ${{ needs.backend.outputs.deployed == 'true' && ' (functions deployed)' || ' (functions unchanged or credentials missing)' }}

  # ---------------------------------------------------------------------------
  # Database: manual, approval-gated. Never runs automatically on push.
  # ---------------------------------------------------------------------------
  database:
    name: Apply pending migrations
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the Supabase project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push pending migrations
        run: supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Report the migration state afterwards
        run: supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
