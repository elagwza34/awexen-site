# نشر تلقائي: كل push على main يبني الواجهة ويرفعها لـ Hostinger
# وطبق الـ migrations المعلّقة على Supabase.
#
# الإعداد مطلوب مرة واحدة فقط:
#   Repository → Settings → Environments → production
#     Secrets:  HOSTINGER_SSH_PRIVATE_KEY, HOSTINGER_SSH_HOST,
#               HOSTINGER_SSH_PORT, HOSTINGER_SSH_USER,
#               SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#     Variables: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY,
#               SUPABASE_PROJECT_REF
#
# ملاحظة: VITE_* تُقرأ كـ variables لا secrets لأنهاقيم عامة
# بتوصل للمتصفح أصلًا (مفتاح publishable فقط، لا service role).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  frontend:
    name: Build and upload to Hostinger
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build with production env
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Abort if a server key leaked into the browser bundle
        run: |
          # Match the VALUE shape, never the bare word. The bundle legitimately
          # contains "service_role" and "sb_secret_" inside Arabic help text
          # and inside supabase-js itself, so grepping for those words aborted
          # every deploy without ever catching a real key.
          LEAK=$(grep -rhoE 'sb_secret_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}' dist/assets/ | sort -u || true)
          if [ -n "$LEAK" ]; then
            echo "::error::A server-side key leaked into dist/. Aborting deploy."
            echo "$LEAK" | cut -c1-12
            exit 1
          fi
          echo "No secret keys in dist."

      - name: Upload dist to public_html over SFTP
        uses: appleboy/scp-action@v0.1.7
        # الأكشن بيرفع الملفات بنجاح لكنه بيرجع exit code غير صفري بعد الرفع
        # (سلوك معروف على استضافات مشتركة). الحكم النهائي هو خطوة التحقق
        # اللي بعدين: لو الرفع فشل فعلًا هتفشل بسبب عدم تطابق الإصدار.
        continue-on-error: true
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          source: frontend/dist/*
          target: public_html
          strip_components: 1
          # بدون rm:true — كان بيحاول يمسح public_html كله قبل الرفع ويفشل
          # على ملفات مش مملوكة للمستخدم، وكان بيوقّع الموقع مؤقتًا.
          # الأصول القديمة لها أسماء hash مميزة فبقاؤها غير ضار وبيفيد التبويبات المفتوحة.

      - name: Verify the deployed version and its assets match this build
        run: |
          EXPECTED=$(node -p "require('./dist/version.json').version")
          ACTUAL=""
          for i in $(seq 1 18); do
            ACTUAL=$(curl -fsS "https://awexen.com/version.json?cb=$(date +%s)" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version||'')}catch{console.log('')}})")
            echo "attempt $i: deployed=$ACTUAL expected=$EXPECTED"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              break
            fi
            sleep 10
          done
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Production version.json ($ACTUAL) does not match the built commit ($EXPECTED)"
            exit 1
          fi

          # نتحقق من كل أصل في HTML الحي: لو الرفع كان جزئيًا هيظهر ملف ناقص
          # أو رجوع صفحة الـfallback بدل JS/CSS.
          HTML=$(curl -fsS "https://awexen.com/?cb=$(date +%s)")
          ASSETS=$(echo "$HTML" | grep -oE '(src|href)="/[^"]+"' | sed 's/.*="//;s/"$//' | sort -u \
            | grep -E '^/(assets|fonts|images)/' || true)
          MISSING=0
          for asset in $ASSETS; do
            HEADERS=$(curl -fsS -o /dev/null -D - "https://awexen.com$asset" || true)
            STATUS=$(echo "$HEADERS" | grep -E '^HTTP/' | tail -1 | grep -oE '[0-9]{3}' | head -1)
            TYPE=$(echo "$HEADERS" | grep -i '^content-type:' | head -1)
            echo "$STATUS $asset ($TYPE)"
            if [ "$STATUS" != "200" ]; then
              MISSING=$((MISSING + 1))
            fi
            case "$asset" in
              *.js) echo "$TYPE" | grep -qi 'javascript' || MISSING=$((MISSING + 1)) ;;
              *.css) echo "$TYPE" | grep -qi 'text/css' || MISSING=$((MISSING + 1)) ;;
              *.woff2) echo "$TYPE" | grep -qi 'font' || MISSING=$((MISSING + 1)) ;;
            esac
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::$MISSING asset(s) referenced by the live HTML are missing or served with the wrong type"
            exit 1
          fi
          echo "All live assets match the new build."

  database:
    name: Apply pending migrations
    # الترحيلات بتتطبّق يدويًا من مالك المشروع على Supabase؛ الـjob بتاع
    # النشر ما لازمش يعدّل قاعدة البيانات تلقائيًا مع كل push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the Supabase project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push pending migrations
        run: supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Report the migration state afterwards
        run: supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  edge-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Regression guard: this job was missing entirely, so every fix inside
      # supabase/functions/ stayed local while the frontend shipped from CI.
      # That is what left production running the old payment-proof path check.
      #
      # النشر محتاج SUPABASE_ACCESS_TOKEN وSUPABASE_PROJECT_REF. قبل كده كان
      # أول أمر بيفشل في أقل من ثانية برسالة غامضة غير مقروءة، فالـworkflow
      # كله يبان أحمر رغم إن الموقع اتنشر. المفتاح دلوقتي بيتفحص صراحةً:
      # لو ناقص، بنسجّل تحذير بالمكان اللي بيتضاف فيه وبنكمل — ولو موجود
      # وبيوصل خطأ حقيقي، الخطوات بتفشل عادي.
      - name: Check Supabase deploy credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          MISSING=""
          if [ -z "$TOKEN" ]; then MISSING="SUPABASE_ACCESS_TOKEN (secret)"; fi
          if [ -z "$PROJECT_REF" ]; then MISSING="$MISSING SUPABASE_PROJECT_REF (variable)"; fi
          if [ -n "$MISSING" ]; then
            echo "::warning::Edge functions were NOT deployed. Missing: $MISSING. Add them in Settings > Environments > production, then re-run this workflow."
            {
              echo "### Edge functions were not deployed"
              echo ""
              echo "Missing: $MISSING"
              echo ""
              echo "Add them in Settings > Environments > production, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy lms-public
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy lms-public --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy lms-api
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy lms-api --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ask-awexen
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy ask-awexen --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy extract-knowledge-pdf
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy extract-knowledge-pdf --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy form-notify
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy form-notify --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy project-calculator
        if: steps.credentials.outputs.ok == 'true'
        run: supabase functions deploy project-calculator --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify the public health endpoint answers
        if: steps.credentials.outputs.ok == 'true'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ vars.VITE_SUPABASE_URL }}/functions/v1/lms-public?path=health" || true)
          echo "lms-public HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::lms-public did not answer 200 after deploying the edge functions"
            exit 1
          fi
