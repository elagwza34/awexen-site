# نشر تلقائي: كل push على main ينشر Edge Functions (لو اتغيّرت والاعتمادات
# متاحة)، والواجهة الثابتة بينشرها تكامل Git في Hostinger
# (repo elagwza34/awexen-site، branch main، root frontend، output dist)
# اللي بيبني ويعمل switch ذرّي للنسخة مع كل push.
#
# مهم: مفيش رفع SCP للواجهة من هنا. كان في كاتبين لنفس الـ public_html
# (التكامل + الأكشن)، والسباق بينهم هو اللي حوّل نشر ناجح لـ release أحمر.
# دلوقتي التكامل هو الكاتب الوحيد، والأكشن بيتحقق إن النشر حصل فعلًا.
#
# الإعداد المطلوب مرة واحدة فقط:
#   Repository → Settings → Environments → production
#     Secrets:  SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
#               HOSTINGER_SSH_PRIVATE_KEY, HOSTINGER_SSH_HOST,
#               HOSTINGER_SSH_PORT, HOSTINGER_SSH_USER (للـ rollback اليدوي فقط)
#     Variables: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY,
#               SUPABASE_PROJECT_REF
#
# ملاحظة: VITE_* تُقرأ كـ variables لأنها قيم عامة بتوصل للمتصفح أصلًا
# (مفتاح publishable فقط، لا service role). والبناء على Hostinger بيقرأ
# frontend/.env.production المتتبَّع في الريبو.
#
# Hostinger publishes independently. Use backward-compatible backend releases
# before pushing frontend callers. Migrations require an explicit manual input.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Prior main commit SHA for backend-only rollback
        type: string
        required: false
      apply_migrations:
        description: Apply reviewed production database migrations
        type: boolean
        default: false
      reviewed_migrations:
        description: Exact reviewed SQL filenames, comma separated
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Edge Functions
  # ---------------------------------------------------------------------------
  backend:
    if: github.ref == 'refs/heads/main' && !inputs.apply_migrations
    name: Backend (Edge Functions)
    runs-on: ubuntu-latest
    environment: production
    outputs:
      functions_changed: ${{ steps.scope.outputs.functions }}
      deployed: ${{ steps.deploy.outputs.complete }}
    steps:
      # fetch-depth: 0 عشان نقدر نقارن مع الكوميت السابق بدقة.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require passing CI for this release commit
        if: inputs.backend_ref == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          const url = new URL(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs`);
          url.searchParams.set("head_sha", process.env.GITHUB_SHA);
          url.searchParams.set("event", "push");
          for (let attempt = 1; attempt <= 40; attempt++) {
            const response = await fetch(url, {
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" },
              signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) throw new Error(`CI lookup failed with HTTP ${response.status}.`);
            const { workflow_runs: runs } = await response.json();
            const run = runs[0];
            if (run?.status === "completed") {
              if (run.conclusion !== "success") throw new Error(`CI run ${run.id} ended with ${run.conclusion}.`);
              console.log(`CI run ${run.id} passed for this commit.`);
              process.exit(0);
            }
            if (attempt < 40) await new Promise((resolve) => setTimeout(resolve, 15_000));
          }
          throw new Error("No passing push-triggered CI run was found for this commit.");
          NODE

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # بنحدد هل الدوال اتغيّرت في الـpush ده. لو اتغيّرت والاعتمادات
      # ناقصة، النشر بيفشل صراحةً بدل ما الكود الجديد يفضل محلي.
      - name: Detect changed backend files
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE=""
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE=$(git rev-parse HEAD^)
          fi
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE" "$SHA")
          else
            CHANGED=$(git show --name-only --pretty=format: "$SHA")
          fi
          FUNCTIONS=$(printf '%s\n' "$CHANGED" | grep -E '^supabase/(functions/|config\.toml$)' || true)
          MIGRATIONS=$(printf '%s\n' "$CHANGED" | grep -E '^supabase/migrations/' || true)
          if [ -n "$FUNCTIONS" ]; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$FUNCTIONS" | sed 's/^/  /'
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$MIGRATIONS" ]; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Migration files changed. They are NOT applied by this workflow; apply them manually with an approved Supabase session."
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Supabase deploy credentials
        id: credentials
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          FUNCTIONS_CHANGED: ${{ steps.scope.outputs.functions }}
          EVENT: ${{ github.event_name }}
        run: |
          MISSING=""
          if [ -z "$TOKEN" ]; then MISSING="SUPABASE_ACCESS_TOKEN (secret)"; fi
          if [ -z "$PROJECT_REF" ]; then MISSING="$MISSING SUPABASE_PROJECT_REF (variable)"; fi
          if [ -n "$MISSING" ]; then
            if [ "$FUNCTIONS_CHANGED" = "true" ] || [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::supabase/functions changed in this commit, but $MISSING is missing from the production environment. Refusing to leave the new backend code undeployed. Add it in Settings > Environments > production, then re-run this workflow. Release verification will fail. Hostinger publishes independently of this workflow."
              exit 1
            fi
            echo "::warning::Edge functions were NOT deployed. Missing: $MISSING. Add them in Settings > Environments > production to enable backend deploys."
            {
              echo "### Backend deploy skipped"
              echo ""
              echo "Missing: $MISSING"
              echo ""
              echo "No function files changed in this push. This run does not attest the deployed function sources."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy and attest configured functions
        if: steps.credentials.outputs.ok == 'true' && (steps.scope.outputs.functions == 'true' || github.event_name == 'workflow_dispatch')
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          BACKEND_REF: ${{ inputs.backend_ref }}
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE"
          if [ -n "$BACKEND_REF" ]; then
            [[ "$BACKEND_REF" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Use a full commit SHA."; exit 1; }
            git merge-base --is-ancestor "$BACKEND_REF" HEAD || { echo "::error::Rollback target must be in main history."; exit 1; }
            SOURCE="$RUNNER_TEMP/edge-source"
            git worktree add --detach "$SOURCE" "$BACKEND_REF"
          fi
          node frontend/scripts/deploy-edge-release.mjs "$SOURCE" "$RUNNER_TEMP/edge-release.json"
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Upload function version evidence
        if: always() && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: edge-release
          path: ${{ runner.temp }}/edge-release.json
          if-no-files-found: ignore

      - name: Verify production backend contracts
        run: node frontend/scripts/check-production-backend.mjs

  # ---------------------------------------------------------------------------
  # Frontend: verify the Hostinger Git auto-deploy
  #
  # Hostinger rebuilds and publishes the frontend on every push to main
  # (root frontend, output dist) and switches releases atomically. This job
  # is the verification half of that single-writer setup: it proves the push
  # actually reached production, checks every asset the live HTML references,
  # and looks for a server key in the served bundles.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (auto-deploy verification)
    needs: backend
    if: inputs.backend_ref == '' && !inputs.apply_migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for Hostinger to publish this commit
        run: |
          EXPECTED=$(git rev-parse --short HEAD)
          ACTUAL=""
          for i in $(seq 1 24); do
            ACTUAL=$(curl -fsS "https://awexen.com/version.json?cb=$(date +%s)" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version||'')}catch{console.log('')}})")
            echo "attempt $i: live=$ACTUAL expected=$EXPECTED"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              break
            fi
            sleep 15
          done
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Hostinger has not published $EXPECTED after 6 minutes (live=$ACTUAL). Check the website's Git deployment in hPanel."
            exit 1
          fi
          echo "Hostinger published $EXPECTED."

      - name: Verify live assets and scan the bundles for leaked server keys
        run: |
          node --input-type=module - <<'NODE'
          const base = "https://awexen.com";
          const html = await (await fetch(`${base}/?cb=${Date.now()}`)).text();
          const assets = [...new Set([...html.matchAll(/(?:src|href)="(\/[^"]+)"/g)].map((m) => m[1]))]
            .filter((path) => /^\/(assets|fonts|images)\//.test(path));
          let failures = 0;
          for (const asset of assets) {
            const script = asset.endsWith(".js");
            const res = await fetch(base + asset);
            const type = res.headers.get("content-type") ?? "";
            let ok = res.status === 200;
            if (script) ok &&= /javascript/i.test(type);
            if (asset.endsWith(".css")) ok &&= /text\/css/i.test(type);
            if (asset.endsWith(".woff2")) ok &&= /font/i.test(type);
            console.log(`${res.status} ${asset} (${type || "no content-type"})`);
            if (!ok) {
              console.error(`::error::${asset} is missing or served with the wrong content type`);
              failures += 1;
              continue;
            }
            if (!script) continue;
            const body = await res.text();
            if (/sb_secret_[A-Za-z0-9_-]{16,}/.test(body)) {
              console.error(`::error::a Supabase secret key is present in ${asset}`);
              failures += 1;
            }
            for (const match of body.matchAll(/eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}/g)) {
              try {
                const payload = JSON.parse(Buffer.from(match[0].split(".")[1], "base64url").toString("utf8"));
                if (payload.role === "service_role") {
                  console.error(`::error::a service_role JWT is present in ${asset}`);
                  failures += 1;
                }
              } catch {
                // Not a decodable JWT; nothing to check.
              }
            }
          }
          if (failures > 0) {
            console.error(`::error::${failures} live asset check(s) failed`);
            process.exit(1);
          }
          console.log(`Verified ${assets.length} live assets; no server key found.`);
          NODE

  # ---------------------------------------------------------------------------
  # Release gate: one place that proves what production is running
  # ---------------------------------------------------------------------------
  release:
    name: Release verification
    needs: [backend, frontend]
    if: always() && inputs.backend_ref == '' && !inputs.apply_migrations
    runs-on: ubuntu-latest
    steps:
      - name: Verify frontend, backend, and release consistency
        run: |
          echo "backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }} functions-changed=${{ needs.backend.outputs.functions_changed }} backend-deployed=${{ needs.backend.outputs.deployed }}"
          if [ "${{ needs.backend.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::Release incomplete: a required job did not succeed."
            exit 1
          fi
          EXPECTED="${GITHUB_SHA:0:7}"
          LIVE=$(curl -fsS "https://awexen.com/version.json?cb=$(date +%s)" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).version||'')})")
          echo "live version: $LIVE (expected $EXPECTED)"
          if [ "$LIVE" != "$EXPECTED" ]; then
            echo "::error::Live version.json does not identify this commit."
            exit 1
          fi
          {
            echo "### Release verified"
            echo ""
            echo "- Frontend: \`$LIVE\` (assets checked against live HTML)"
            echo "- Backend: readiness, protected access, and calculator contract checked${BACKEND_NOTE}"
            echo "- Migrations: manual / approval-gated (not applied here)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BACKEND_NOTE: ${{ needs.backend.outputs.deployed == 'true' && ' (functions deployed)' || ' (source deployment not performed by this run)' }}

  # ---------------------------------------------------------------------------
  # Database: explicit manual opt-in, with production environment approval.
  # ---------------------------------------------------------------------------
  database:
    name: Apply pending migrations
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.apply_migrations && inputs.backend_ref == ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Link to the Supabase project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push pending migrations
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --dry-run 2>&1 | tee "$RUNNER_TEMP/migration-plan.txt"
          node frontend/scripts/verify-migration-plan.mjs "$RUNNER_TEMP/migration-plan.txt"
          supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REVIEWED_MIGRATIONS: ${{ inputs.reviewed_migrations }}

      - name: Report the migration state afterwards
        run: supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
