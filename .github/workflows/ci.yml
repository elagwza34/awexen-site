name: CI

on:
  push:
  pull_request:

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: >-
          deno check
          supabase/functions/ask-awexen/index.ts
          supabase/functions/extract-knowledge-pdf/index.ts
          supabase/functions/lms-public/index.ts
          supabase/functions/lms-api/index.ts
          supabase/functions/project-calculator/index.ts
      - run: >-
          deno lint
          supabase/functions/_shared/http.ts
          supabase/functions/ask-awexen/index.ts
          supabase/functions/extract-knowledge-pdf/index.ts
          supabase/functions/lms-public/index.ts
          supabase/functions/lms-api/index.ts
          supabase/functions/project-calculator/
          supabase/functions/_shared/calculator/
      - run: deno test supabase/functions/project-calculator/public-config_test.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types scripts/test-calculator.mjs
      - run: npm audit --audit-level=high
      - run: npm run test:crm
      - run: npm exec tsc -- --noEmit
      - run: npm run test:unit
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run end-to-end tests (Chromium, Firefox, WebKit)
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
