name: CI

on:
  push:
  pull_request:

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: >-
          deno check
          supabase/functions/ask-awexen/index.ts
          supabase/functions/extract-knowledge-pdf/index.ts
          supabase/functions/lms-public/index.ts
          supabase/functions/lms-api/index.ts
      - run: >-
          deno lint
          supabase/functions/_shared/http.ts
          supabase/functions/ask-awexen/index.ts
          supabase/functions/extract-knowledge-pdf/index.ts
          supabase/functions/lms-public/index.ts
          supabase/functions/lms-api/index.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm exec tsc -- --noEmit
      - run: npm run build
