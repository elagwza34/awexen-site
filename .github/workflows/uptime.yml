# Scheduled production health check.
#
# Detects the failures that a Git push cannot prove: the CDN serving a partial
# deploy, the backend losing its health endpoint, or metadata regressing.
# A failed run notifies the repository owner through GitHub's normal
# notification settings. No paid dependency is involved.
#
# Manual run: Actions -> Production health -> Run workflow.

name: Production health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: production-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    name: Verify live site, backend, and metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify production backend contracts
        run: node frontend/scripts/check-production-backend.mjs

      - name: Check the live site
        env:
          SITE: https://awexen.com
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/" || true)
          [ "$HOME_STATUS" = "200" ] || fail "Home page answered HTTP $HOME_STATUS"

          VERSION=$(curl -fsS "$SITE/version.json?cb=$(date +%s)" || true)
          echo "version.json: $VERSION"
          echo "$VERSION" | grep -Eq '"version":"[0-9a-f]{7,40}"' \
            || fail "version.json is missing a build id"

          SITEMAP=$(curl -fsS "$SITE/sitemap.xml" || true)
          for path in "$SITE/pms" "$SITE/project-calculator"; do
            echo "$SITEMAP" | grep -qF "$path" || fail "sitemap is missing $path"
          done

          ROBOTS=$(curl -fsS "$SITE/robots.txt" || true)
          echo "$ROBOTS" | grep -qF "Sitemap: $SITE/sitemap.xml" \
            || fail "robots.txt does not point at the sitemap"

          # Every asset the live HTML references must exist, which catches a
          # partial upload or a fallback page served in place of JS/CSS.
          HTML=$(curl -fsS "$SITE/?cb=$(date +%s)" || true)
          ASSETS=$(echo "$HTML" | grep -oE 'src="/[^"]+"' | sed 's/.*="//;s/"$//' \
            | grep -E '^/assets/' || true)
          for asset in $ASSETS; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE$asset")
            [ "$STATUS" = "200" ] || fail "asset $asset answered HTTP $STATUS"
          done

          {
            echo "### Production health OK"
            echo ""
            echo "- home: $HOME_STATUS"
            echo "- version: $VERSION"
            echo "- backend: database readiness, protected access, and calculator contract verified"
            echo "- sitemap routes and assets verified"
          } >> "$GITHUB_STEP_SUMMARY"
